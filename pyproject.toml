[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hls-validation"
version = "0.1.0"
description = "Validation and optimization starter flow for Vitis HLS testcases"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "PLACEHOLDER"}
dependencies = ["rich>=13.0"]

[project.scripts]
hls-flow = "hls_validation.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
